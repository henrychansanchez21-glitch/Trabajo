<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignador de Tareas - Móvil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 400px; /* Ajustado para móviles */
        }
        .task-form {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .task-list {
            list-style: none;
            padding: 0;
        }
        .task-item {
            background-color: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
        }
        .task-item.completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .task-content {
            flex: 1;
            margin-left: 10px;
        }
        .delete-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
            background-color: #f44336;
            color: white;
            margin-left: 10px;
        }
        @media (max-width: 600px) {
            /* Asegurar que sea perfecto para móviles */
            .task-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .task-content {
                margin-left: 0;
                margin-top: 10px;
            }
            .delete-btn {
                margin-top: 10px;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Asignador de Tareas</h1>
        <form class="task-form" id="taskForm">
            <input type="text" id="taskTitle" placeholder="Título de la tarea" required>
            <input type="text" id="taskAssignee" placeholder="Asignar a (opcional)">
            <button type="submit">Agregar Tarea</button>
        </form>
        <ul class="task-list" id="taskList"></ul>
    </div>

    <script>
        const taskForm = document.getElementById('taskForm');
        const taskList = document.getElementById('taskList');
        const taskTitle = document.getElementById('taskTitle');
        const taskAssignee = document.getElementById('taskAssignee');

        taskForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const title = taskTitle.value.trim();
            const assignee = taskAssignee.value.trim();
            if (title) {
                addTask(title, assignee);
                taskTitle.value = '';
                taskAssignee.value = '';
            }
        });

        function addTask(title, assignee) {
            const li = document.createElement('li');
            li.className = 'task-item';
            li.innerHTML = `
                <input type="checkbox" class="task-checkbox">
                <div class="task-content">
                    <strong>${title}</strong>
                    ${assignee ? `<br><small>Asignado a: ${assignee}</small>` : ''}
                </div>
                <button class="delete-btn">Eliminar</button>
            `;
            taskList.appendChild(li);

            // Event listener para el checkbox
            li.querySelector('.task-checkbox').addEventListener('change', function() {
                li.classList.toggle('completed');
            });

            // Event listener para eliminar
            li.querySelector('.delete-btn').addEventListener('click', function() {
                taskList.removeChild(li);
            });
        }
    </script>
</body>
</html>
