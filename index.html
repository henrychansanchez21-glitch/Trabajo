<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignador de Tareas con Firebase</title>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // Configuración de Firebase (REEMPLAZA CON TU CONFIGURACIÓN REAL)
        const firebaseConfig = {
            apiKey: "AIzaSyBcdWMdR_xVCFFQQPcTGPhbw8DYykN4qUg",
            authDomain: "app-de-tareas-80324.firebaseapp.com",
            projectId: "app-de-tareas-80324",
            storageBucket: "app-de-tareas-80324.firebasestorage.app",
            messagingSenderId: "166776767275",
            appId: "1:166776767275:web:f6f7edada36c02b93f3b6e"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Exportar db para usar en el script principal
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.updateDoc = updateDoc;
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        h1 {
            text-align: center;
            font-size: 1.5em;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border-bottom: 1px solid #eee;
            margin-bottom: 10px;
        }
        li.completed {
            text-decoration: line-through;
            color: #888;
        }
        .task-checkbox {
            margin-right: 10px;
            margin-top: 5px;
        }
        .task-details {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .task-text {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .assignee {
            font-size: 0.9em;
            color: #666;
        }
        .delete-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
            align-self: flex-start;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Asignador de Tareas con Firebase</h1>
        <input type="text" id="task-input" placeholder="Escribe la tarea">
        <select id="assignee-select">
            <option value="">Selecciona a una persona</option>
            <option value="Henry">Henry</option>
            <option value="Carlos">Carlos</option>
            <option value="Ammy">Ammy</option>
        </select>
        <button id="add-task-btn">Agregar Tarea</button>
        <ul id="task-list"></ul>
    </div>

    <script>
        const taskInput = document.getElementById('task-input');
        const assigneeSelect = document.getElementById('assignee-select');
        const addTaskBtn = document.getElementById('add-task-btn');
        const taskList = document.getElementById('task-list');

        // Función para cargar tareas desde Firestore
        async function loadTasks() {
            const querySnapshot = await getDocs(collection(window.db, "tasks"));
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                addTaskToUI(data.taskText, data.assignee, data.completed, doc.id);
            });
        }

        // Función para agregar tarea a la UI
        function addTaskToUI(taskText, assignee, completed, id) {
            const li = document.createElement('li');
            li.classList.toggle('completed', completed);
            li.innerHTML = `
                <input type="checkbox" class="task-checkbox" ${completed ? 'checked' : ''}>
                <div class="task-details">
                    <div class="task-text">${taskText}</div>
                    <div class="assignee">Asignado a: ${assignee}</div>
                </div>
                <button class="delete-btn">Eliminar</button>
            `;
            taskList.appendChild(li);

            // Evento para checkbox (actualizar en Firestore)
            const checkbox = li.querySelector('.task-checkbox');
            checkbox.addEventListener('change', async () => {
                li.classList.toggle('completed');
                await updateDoc(doc(window.db, "tasks", id), {
                    completed: checkbox.checked
                });
            });

            // Evento para eliminar
            const deleteBtn = li.querySelector('.delete-btn');
            deleteBtn.addEventListener('click', async () => {
                await deleteDoc(doc(window.db, "tasks", id));
                taskList.removeChild(li);
            });
        }

        // Evento para agregar tarea
        addTaskBtn.addEventListener('click', async () => {
            const taskText = taskInput.value.trim();
            const assignee = assigneeSelect.value;
            if (taskText && assignee) {
                try {
                    const docRef = await addDoc(collection(window.db, "tasks"), {
                        taskText: taskText,
                        assignee: assignee,
                        completed: false
                    });
                    addTaskToUI(taskText, assignee, false, docRef.id);

                    // Limpiar inputs
                    taskInput.value = '';
                    assigneeSelect.value = '';
                } catch (e) {
                    console.error("Error adding document: ", e);
                    alert("Error al agregar tarea. Revisa la consola.");
                }
            } else {
                alert('Por favor, completa la tarea y selecciona a una persona.');
            }
        });

        // Cargar tareas al iniciar
        loadTasks();
    </script>
</body>
</html>
