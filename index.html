<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Tareas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        h1 {
            text-align: center;
            color: #4a6fa5;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        
        .input-container {
            display: flex;
            margin-bottom: 20px;
        }
        
        #taskInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-right: 10px;
        }
        
        #addBtn {
            background-color: #4a6fa5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        #addBtn:hover {
            background-color: #3a5a80;
        }
        
        .filter-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .filter-btn {
            flex: 1;
            padding: 10px;
            margin: 0 5px;
            background-color: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .filter-btn.active {
            background-color: #4a6fa5;
            color: white;
        }
        
        .task-list {
            list-style-type: none;
        }
        
        .task-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: all 0.3s;
        }
        
        .task-item:last-child {
            border-bottom: none;
        }
        
        .task-item.completed {
            background-color: #f9f9f9;
            opacity: 0.7;
        }
        
        .task-checkbox {
            margin-right: 15px;
            transform: scale(1.2);
        }
        
        .task-text {
            flex: 1;
            font-size: 16px;
        }
        
        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }
        
        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            margin-left: 10px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #666;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #888;
        }
        
        .empty-state img {
            width: 100px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .filter-container {
                flex-direction: column;
            }
            
            .filter-btn {
                margin: 3px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mis Tareas</h1>
        
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Escribe una nueva tarea...">
            <button id="addBtn">Agregar</button>
        </div>
        
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="pending">Pendientes</button>
            <button class="filter-btn" data-filter="completed">Completadas</button>
        </div>
        
        <ul class="task-list" id="taskList">
            <!-- Las tareas se agregarán aquí dinámicamente -->
        </ul>
        
        <div class="stats">
            <span id="totalTasks">Total: 0</span>
            <span id="completedTasks">Completadas: 0</span>
        </div>
    </div>

    <script>
        // Elementos del DOM
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const totalTasksSpan = document.getElementById('totalTasks');
        const completedTasksSpan = document.getElementById('completedTasks');
        
        // Array para almacenar las tareas
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';
        
        // Inicializar la aplicación
        function init() {
            renderTasks();
            updateStats();
            
            // Event listeners
            addBtn.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
            
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Actualizar botones activos
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Cambiar filtro
                    currentFilter = this.getAttribute('data-filter');
                    renderTasks();
                });
            });
        }
        
        // Agregar una nueva tarea
        function addTask() {
            const text = taskInput.value.trim();
            
            if (text === '') {
                alert('Por favor, escribe una tarea');
                return;
            }
            
            // Crear nueva tarea
            const newTask = {
                id: Date.now(),
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            };
            
            // Agregar a la lista
            tasks.push(newTask);
            
            // Guardar en localStorage
            saveTasks();
            
            // Limpiar input
            taskInput.value = '';
            
            // Actualizar la vista
            renderTasks();
            updateStats();
        }
        
        // Cambiar estado de una tarea (completada/pendiente)
        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            
            saveTasks();
            renderTasks();
            updateStats();
        }
        
        // Eliminar una tarea
        function deleteTask(id) {
            if (confirm('¿Estás seguro de que quieres eliminar esta tarea?')) {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                renderTasks();
                updateStats();
            }
        }
        
        // Renderizar las tareas en la lista
        function renderTasks() {
            // Filtrar tareas según el filtro actual
            let filteredTasks = tasks;
            if (currentFilter === 'pending') {
                filteredTasks = tasks.filter(task => !task.completed);
            } else if (currentFilter === 'completed') {
                filteredTasks = tasks.filter(task => task.completed);
            }
            
            // Limpiar la lista
            taskList.innerHTML = '';
            
            // Mostrar mensaje si no hay tareas
            if (filteredTasks.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.innerHTML = `
                    <div>📝</div>
                    <p>No hay tareas ${currentFilter === 'all' ? '' : currentFilter}</p>
                `;
                taskList.appendChild(emptyState);
                return;
            }
            
            // Agregar cada tarea a la lista
            filteredTasks.forEach(task => {
                const taskItem = document.createElement('li');
                taskItem.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                taskItem.innerHTML = `
                    <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''}>
                    <span class="task-text">${task.text}</span>
                    <button class="delete-btn">🗑️</button>
                `;
                
                // Event listeners para los elementos de la tarea
                const checkbox = taskItem.querySelector('.task-checkbox');
                const deleteBtn = taskItem.querySelector('.delete-btn');
                
                checkbox.addEventListener('change', () => toggleTask(task.id));
                deleteBtn.addEventListener('click', () => deleteTask(task.id));
                
                taskList.appendChild(taskItem);
            });
        }
        
        // Actualizar estadísticas
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(task => task.completed).length;
            
            totalTasksSpan.textContent = `Total: ${total}`;
            completedTasksSpan.textContent = `Completadas: ${completed}`;
        }
        
        // Guardar tareas en localStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }
        
        // Inicializar la aplicación cuando se carga la página
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
