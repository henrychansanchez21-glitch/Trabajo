<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas Compacta</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 5px; /* Reducción de padding */
        }
        .header {
            padding: 5px 0; /* Reducción de padding */
            border-bottom: 1px solid #ccc;
            margin-bottom: 10px; /* Reducción de margen */
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.2em; /* Título más pequeño */
            color: #1a1a1a;
        }
        h2 {
            font-size: 1em; /* Subtítulos más pequeños */
            color: #1a1a1a;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 3px;
            margin-top: 15px;
        }
        /* Contenedor de Tareas */
        .task-list {
            margin-bottom: 10px;
            padding: 5px;
            border: 1px solid #ddd;
            background-color: #fff;
            border-radius: 3px;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0; /* Espaciado de tarea reducido */
            border-bottom: 1px dashed #eee;
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-details {
            flex-grow: 1;
            margin-right: 5px;
            overflow-wrap: break-word; /* Para asegurar el ajuste en pantallas pequeñas */
            min-width: 0;
        }
        .task-description {
            font-weight: bold;
            font-size: 0.9em; /* Descripción más pequeña */
        }
        .task-info {
            font-size: 0.7em; /* Info extra más pequeña */
            color: #666;
        }
        .task-completed .task-description,
        .task-completed .task-assignee-text {
            text-decoration: line-through;
            color: #999;
        }
        .priority-alta {
            color: red;
            font-weight: bold;
        }
        .delete-button {
            background-color: red;
            color: white;
            border: none;
            padding: 3px 6px;
            font-size: 0.7em;
            border-radius: 3px;
            cursor: pointer;
            flex-shrink: 0; /* No se encoge */
        }
        .completion-checkbox {
            margin-right: 5px;
            flex-shrink: 0;
        }
        .empty-message {
            text-align: center; color: #666; padding: 5px; background: #f0f0f0; border-radius: 4px; font-size: 0.8em;
        }

    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, addDoc, deleteDoc, onSnapshot, collection, query, serverTimestamp, setLogLevel, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Establecer nivel de log para depuración de Firestore
        setLogLevel('debug');

        // =========================================================================================
        // CONFIGURACIÓN DE USUARIOS ASIGNABLES Y FIREBASE
        // =========================================================================================
        
        // Variables de Autenticación (Mantenidas para la lógica interna de la tarea, pero sin UI de login)
        const POPEYE_USER_ID = "Popeye";
        const PUBLIC_USER_ID = "PUBLIC_ACCESS"; 
        let currentUserId = PUBLIC_USER_ID; // Siempre acceso público, sin login

        // Mapeo de IDs a Nombres para mostrar en la lista de tareas
        const ASSIGNEE_MAP = {
            "2004211109": "Henry",
            "2005209090": "Carlos",
            "2006190501": "Ammy",
            [POPEYE_USER_ID]: POPEYE_USER_ID, 
            "Sin asignar": "Sin asignar"
        };
        
        // Mapeo de IDs a los contenedores HTML
        const ASSIGNEE_CONTAINERS = {
            "2004211109": "tasks-container-henry",
            "2005209090": "tasks-container-carlos",
            "2006190501": "tasks-container-ammy",
            "Sin asignar": "tasks-container-unassigned"
        };

        // Función auxiliar para obtener el nombre a partir del ID
        function getAssigneeName(assigneeId) {
            return ASSIGNEE_MAP[assigneeId] || assigneeId;
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBGqi47buPZbP32mKFjqAYyZeYeSTRF32Y",
            authDomain: "nuevastareas-5a044.firebaseapp.com",
            projectId: "nuevastareas-5a044",
            storageBucket: "nuevastareas-5a044.firebasestorage.app",
            messagingSenderId: "57610924140",
            appId: "1:57610924140:web:20fec16c57eea0ce832849"
        };

        const appId = firebaseConfig.projectId; 
        
        let app, db;

        // --- Lógica de Inicialización de Usuario y Firebase ---

        function checkUserStatus() {
            const displayElement = document.getElementById('user-id-display');
            // Como quitamos el login, siempre mostramos acceso público
            displayElement.textContent = `ID de Usuario: ${PUBLIC_USER_ID} (Acceso Público)`;
            displayElement.style.color = 'gray';
        }

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("Firebase inicializado.");
            checkUserStatus(); 
            startRealtimeTaskListener();

        } catch (error) {
            console.error("Error al inicializar Firebase:", error);
            document.getElementById('error-message').textContent = 'Error al inicializar Firebase. Revisa la consola y tu configuración.';
            document.getElementById('error-message').style.display = 'block';
        }


        // --- Funciones de Firestore (Mantenidas) ---
        // (La función addTask se mantiene, pero no se puede llamar sin un botón)

        function getTasksCollectionRef() {
            const path = `artifacts/${appId}/public/data/tasks`;
            return collection(db, path);
        }
        
        function getTaskDocRef(taskId) {
            return doc(db, `artifacts/${appId}/public/data/tasks/${taskId}`);
        }

        window.toggleTaskCompletion = async function(taskId, currentStatus) {
            try {
                const taskDocRef = getTaskDocRef(taskId);
                await updateDoc(taskDocRef, { completed: !currentStatus });
            } catch (e) {
                console.error("Error al actualizar el estado de la tarea (REVISA REGLAS): ", e);
                // No hay modal de alerta, solo log en consola
            }
        }

        window.deleteTask = async function(taskId) {
            if (!confirm('¿Estás seguro de que quieres eliminar esta tarea?')) return;
            try {
                await deleteDoc(getTaskDocRef(taskId));
            } catch (e) {
                console.error("Error al eliminar documento (REVISA REGLAS): ", e);
                // No hay modal de alerta, solo log en consola
            }
        }

        function startRealtimeTaskListener() {
            if (!db) return;
            const tasksRef = getTasksCollectionRef();
            const q = query(tasksRef);

            onSnapshot(q, (snapshot) => {
                const tasksList = [];
                snapshot.forEach((doc) => {
                    tasksList.push({ id: doc.id, ...doc.data() });
                });
                renderTasks(tasksList);
            }, (error) => {
                console.error("Error al obtener instantánea de tareas:", error);
                document.getElementById('error-message').textContent = 'Error de conexión en tiempo real con Firestore.';
                document.getElementById('error-message').style.display = 'block';
            });
        }

        function renderTasks(tasks) {
            
            // 1. Limpiar todos los contenedores
            Object.values(ASSIGNEE_CONTAINERS).forEach(containerId => {
                document.getElementById(containerId).innerHTML = '';
            });
            document.getElementById('general-empty-message').style.display = 'none';

            // 2. Agrupar y ordenar las tareas
            const groupedTasks = {};
            Object.keys(ASSIGNEE_MAP).forEach(id => {
                if(ASSIGNEE_CONTAINERS[id]) { 
                    groupedTasks[id] = [];
                }
            });

            tasks.forEach(task => {
                const assigneeId = task.assignee || "Sin asignar";
                const targetId = ASSIGNEE_CONTAINERS[assigneeId] ? assigneeId : "Sin asignar"; 
                groupedTasks[targetId].push(task);
            });
            
            // 3. Renderizar cada grupo
            Object.keys(groupedTasks).forEach(assigneeId => {
                const containerId = ASSIGNEE_CONTAINERS[assigneeId];
                const container = document.getElementById(containerId);
                const taskList = groupedTasks[assigneeId];
                
                // Ordenar: Prioridad Alta primero, luego Pendientes (por fecha), luego Completadas.
                taskList.sort((a, b) => {
                    if (a.priority === 'Alta' && b.priority !== 'Alta') return -1;
                    if (a.priority !== 'Alta' && b.priority === 'Alta') return 1;

                    if (a.completed !== b.completed) {
                        return a.completed ? 1 : -1; 
                    }
                    const dateA = a.createdAt?.toMillis() || 0;
                    const dateB = b.createdAt?.toMillis() || 0;
                    return dateB - dateA;
                });


                if (taskList.length === 0) {
                    container.innerHTML = `
                        <p class="empty-message">
                            No hay tareas asignadas a ${getAssigneeName(assigneeId)}.
                        </p>
                    `;
                } else {
                    taskList.forEach(task => {
                        const dateString = task.createdAt
                            ? new Date(task.createdAt.toMillis()).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })
                            : 'Fecha desconocida';
                        
                        const isCompleted = task.completed;
                        const isHighPriority = task.priority === 'Alta' && !isCompleted; 

                        const taskClass = isCompleted 
                            ? 'task-completed' 
                            : (isHighPriority ? 'priority-alta-container' : '');

                        const priorityTextClass = isHighPriority ? 'priority-alta' : '';
                        
                        const assigneeDisplayName = getAssigneeName(task.assignee);
                        const createdByDisplayName = getAssigneeName(task.createdBy) === PUBLIC_USER_ID ? 'Público' : getAssigneeName(task.createdBy);

                        const taskElement = `
                            <div class="task-item ${taskClass}">
                                <input
                                    type="checkbox"
                                    ${isCompleted ? 'checked' : ''}
                                    onclick="toggleTaskCompletion('${task.id}', ${isCompleted})"
                                    class="completion-checkbox"
                                >
                                
                                <div class="task-details">
                                    <p class="task-description">${task.description}</p>
                                    <div class="task-info">
                                        <p>
                                            Asignado a: <span class="task-assignee-text ${priorityTextClass}">${assigneeDisplayName}</span>
                                            <span class="priority-label">(${task.priority || 'N/A'})</span>
                                        </p>
                                        <p>
                                            Creado por: ${createdByDisplayName} el ${dateString}
                                        </p>
                                    </div>
                                </div>

                                <button
                                    onclick="deleteTask('${task.id}')"
                                    class="delete-button"
                                    title="Eliminar Tarea"
                                >
                                    X
                                </button>
                            </div>
                        `;
                        container.insertAdjacentHTML('beforeend', taskElement);
                    });
                }
            });
            
            if(tasks.length === 0) {
                 document.getElementById('general-empty-message').style.display = 'block';
                 document.getElementById('general-empty-message').innerHTML = 'No hay tareas registradas.';
            }
        }
    </script>
</head>
<body>

    <div class="container">
        <header class="header">
            <div>
                <h1>Lista de Tareas</h1>
                <p style="font-size: 0.8em; color: #666; margin-top: 3px;">Asignadas...</p>
                <p id="user-id-display" style="font-size: 0.7em; margin-top: 5px;"></p>
            </div>
        </header>

        <p id="error-message" style="color: red; text-align: center; margin-bottom: 10px; display: none; font-size: 0.8em;"></p>
        <div id="general-empty-message" class="empty-message" style="border: 1px dashed #ccc; background-color: #fff;">
             Cargando tareas...
        </div>

        <div style="margin-top: 15px; padding-bottom: 15px;">

            <div>
                <h2>👤 Henry</h2>
                <div id="tasks-container-henry" class="task-list">
                    </div>
            </div>

            <div>
                <h2>👤 Carlos</h2>
                <div id="tasks-container-carlos" class="task-list">
                    </div>
            </div>
            
            <div>
                <h2>👤 Ammy</h2>
                <div id="tasks-container-ammy" class="task-list">
                    </div>
            </div>

            <div>
                <h2>Vamos a chupar</h2>
                <div id="tasks-container-unassigned" class="task-list" style="border-color: #999;">
                    </div>
            </div>

        </div>

    </div>
</body>
</html>
